:root{--brand:#7e150f;--gold:#c9a46b;--bg:#f9f6f3;--fg:#14141c;--mut:#77767c;--line:#ebe5e0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Onest,Arial,sans-serif;background:var(--bg);color:var(--fg);max-width:520px;margin:0 auto}
.hd{display:flex;align-items:center;gap:12px;padding:18px 16px 6px} .hd i{width:40px;height:40px;border-radius:10px;background:var(--brand);flex:none;display:grid;place-items:center}
.hd h1{font-size:26px;font-weight:500;letter-spacing:-.03em}
.wrap{padding:8px 16px 24px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;margin:8px 0 14px}
.seg span{flex:1;text-align:center;font-size:14px;padding:7px 0;border-radius:9px;color:var(--mut)} .seg .on{background:var(--brand);color:#fff}
.mon{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:500;margin-bottom:14px;padding:0 4px} .mon span{color:var(--mut);font-size:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}
.hero .l{font-size:16px;color:var(--mut)} .hero .v{font-size:56px;font-weight:600;letter-spacing:-.045em;color:var(--brand);line-height:1;margin:6px 0 10px} .hero .v small{font-size:26px;font-weight:500}
.dl{display:inline-block;color:#d0452f;background:#fbeae6;border-radius:999px;padding:5px 12px;font-size:14px}
.k100{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.k100 b{font-size:34px;font-weight:600;color:var(--brand);letter-spacing:-.03em;white-space:nowrap} .k100 span{font-size:15px;line-height:1.35}
h2{font-size:20px;font-weight:500;letter-spacing:-.02em;margin:24px 4px 10px}
.wr{padding:9px 0} .wl{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-bottom:6px} .wl small{display:block;font-size:12px;color:var(--mut)} .wl b{font-weight:500;white-space:nowrap}
.wr.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:14px} .wr.tot .wl{font-weight:600;font-size:17px} .wr.tot .wl b{font-weight:600}
.lg{font-size:13px;color:var(--mut);margin-top:10px;line-height:1.4}
.foot{font-size:12px;color:var(--mut);margin:14px 4px 0;line-height:1.4}

.seg span{cursor:pointer} .mon span{cursor:pointer;padding:0 8px} .mon span.off{opacity:.25;cursor:default}
.dl.up{color:#3f7a4f;background:#e6f0e8}
.wr{padding:9px 0} .tr{position:relative;height:14px} .tr:before{content:'';position:absolute;left:0;right:0;top:5px;height:4px;border-radius:2px;background:#efe9e4} .tr i{position:absolute;top:0;height:14px;border-radius:4px;min-width:3px}
.stop{padding:80px 24px;text-align:center;font-size:18px;line-height:1.5} .stop b{display:block;font-size:24px;margin-bottom:8px}
#gr text{font-family:Onest,Arial,sans-serif}


.seg{background:transparent;border:0;padding:0;gap:6px;margin:8px 0 12px}
.seg span{background:transparent;color:var(--mut);border-radius:999px;padding:6px 0;font-size:14px}
.seg .on{background:#efe9e4;color:var(--fg);font-weight:600}
.mon{background:var(--brand);color:#fff;border-radius:16px;padding:12px 10px;font-size:21px;font-weight:600;margin-bottom:16px}
.mon span{color:#fff;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px;padding:0}
.mon span.off{opacity:.3}

body{padding-bottom:84px}
.bnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 2px 16px;max-width:520px;margin:0 auto}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;letter-spacing:-.01em;color:#6b6a70;cursor:pointer;flex:1}
.bnav a.on{color:var(--brand);font-weight:600}
.rows{padding:4px 18px;margin-top:14px} .r{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.r:last-child{border:0} .r small{display:block;font-size:12px;color:var(--mut)} .r b{font-weight:500;white-space:nowrap}
.dl.bad{color:#d0452f;background:#fbeae6}

.r{display:block} .rt{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px}
.tr{position:relative;height:10px} .tr:before{content:'';position:absolute;left:0;right:0;top:3px;height:4px;border-radius:2px;background:var(--line)} .tr i{position:absolute;left:0;top:0;height:10px;border-radius:4px}
.rows{margin-top:0} .lg{font-size:14px;color:var(--mut);line-height:1.4}
.gb{fill:#d9d1ca} .gb-on{fill:var(--brand)} .gt{fill:var(--mut)} .gt-on{fill:var(--fg)}
h2{font-size:19px;font-weight:600;margin:22px 4px 10px}

:root{--brand:#c9a46b;--bg:#16171b;--fg:#f2efe9;--mut:#9a98a0;--line:#2c2d33}
body{background:var(--bg);color:var(--fg)}
.card{background:#202127;border-color:var(--line)}
.hero .v,.k100 b{color:#e0bf86}
.hd i{background:#c9a46b} .hd i svg{stroke:#16171b}
.seg .on{background:#2c2d33;color:var(--fg)}
.mon{background:#c9a46b;color:#16171b} .mon span{color:#16171b;background:rgba(0,0,0,.12)}
.dl{background:#3a2422;color:#ff8a78} .dl.up{background:#1f3326;color:#7fd39a}
.wl b[style*="#14141c"]{color:var(--fg)!important}
.wr.tot{border-top-color:var(--line)}
#gr rect[fill="#d9d1ca"]{fill:#3a3b42} #gr rect[fill="#7e150f"]{fill:#c9a46b}
#gr text[fill="#14141c"]{fill:#f2efe9} #gr text[fill="#7e150f"]{fill:#e0bf86}
.tr:before{background:#2c2d33} .tr i[style*="#2f2f3a"]{background:#9a98a0!important} .tr i[style*="#7e150f"]{background:#c9a46b!important}
.wl b[style*="#7e150f"]{color:#e0bf86!important}
.bnav{background:#1d1e23;border-top-color:#2c2d33} .bnav a{color:#9a98a0} .bnav a.on{color:#e0bf86} .dl.bad{background:#3a2422;color:#ff8a78} .r{border-bottom-color:#2c2d33} .gb{fill:#3a3b42} .gb-on{fill:#c9a46b} .rows{background:#202127}

.hero .hn{color:var(--fg)}
.pusto{font-size:15px;line-height:1.5;color:var(--mut)}

.nl{position:relative;display:flex;gap:8px;overflow-x:auto;margin:4px -16px 4px;padding:4px 16px 8px;scrollbar-width:none}
.nl::-webkit-scrollbar{display:none}
.nl span{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#202127;color:var(--fg);font-size:14px;cursor:pointer;white-space:nowrap}
.nl span.on{background:#e0bf86;border-color:#e0bf86;color:#16171b;font-weight:600}

.nb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#202127;border:1px solid var(--line);border-radius:16px;padding:10px 16px;margin:4px 0 8px;color:var(--fg);font:inherit;font-size:17px;font-weight:600;text-align:left;cursor:pointer}
.nb small{display:block;font-size:12px;font-weight:400;color:var(--mut);margin-bottom:2px}
.nb b{color:#e0bf86;font-size:18px}
.sh-fon{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#202127;border-radius:20px 20px 0 0;padding:8px 16px 28px;z-index:11}
.sh-ruchka{width:40px;height:4px;border-radius:2px;background:#3a3b42;margin:0 auto 12px}
.sh-z{font-size:14px;color:var(--mut);margin:0 4px 6px}
.sh a{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer}
